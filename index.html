<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ RESPO‑SCHALTUNG 2.0 · 756 ACHSEN · ZAHNRAD‑METHODE</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at 20% 30%, #1a1a24, #000000);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Consolas', monospace;
      padding: 12px;
      color: #c0d0d0;
    }

    .container {
      max-width: 1400px;
      width: 100%;
      background: rgba(12, 12, 20, 0.5);
      backdrop-filter: blur(2px);
      border-radius: 32px;
      padding: 20px 24px 30px;
      border: 1px solid rgba(180, 200, 220, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 0 60px rgba(200, 220, 240, 0.02);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(180, 200, 220, 0.06);
      padding-bottom: 6px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #e0e8f0, #b0c8d8, #8098b0, #c0d8e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 small {
      font-size: 12px;
      letter-spacing: 3px;
      -webkit-text-fill-color: #4a5a6a;
      color: #4a5a6a;
    }

    .status-badge {
      display: flex;
      gap: 18px;
      font-size: 11px;
      color: #5a7a8a;
      letter-spacing: 1px;
    }
    .status-badge span {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2a4a5a;
      transition: 0.3s;
    }
    .dot.on {
      background: #8cf0d0;
      box-shadow: 0 0 12px #8cf0d0;
    }
    .dot.pulse {
      background: #f0d080;
      animation: pulse 1.2s infinite;
    }
    .dot.connected {
      background: #70c8ff;
      box-shadow: 0 0 16px #70c8ff;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .grid-wrap {
      position: relative;
      margin: 10px 0 18px;
      border-radius: 20px;
      background: rgba(6, 8, 14, 0.6);
      padding: 12px;
      border: 1px solid rgba(120, 160, 190, 0.04);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7);
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(27, 1fr);
      grid-template-rows: repeat(28, 1fr);
      gap: 2px;
      aspect-ratio: 27 / 28;
      width: 100%;
      max-height: 70vh;
    }

    .cell {
      background: rgba(24, 32, 40, 0.25);
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      color: #8a9aaa;
      transition: all 0.25s cubic-bezier(0.15, 0.8, 0.3, 1.2);
      cursor: pointer;
      text-shadow: 0 0 6px rgba(160, 200, 240, 0.1);
      border: 1px solid rgba(100, 140, 170, 0.03);
      backdrop-filter: blur(1px);
      will-change: transform, background, box-shadow;
      word-break: break-all;
      text-align: center;
      line-height: 1.1;
      overflow: hidden;
    }

    .cell:hover {
      z-index: 10;
      border-color: rgba(200, 230, 255, 0.15);
    }

    .cell.active {
      background: radial-gradient(circle at 30% 30%, #d8e8f0, #a0b8c8);
      color: #0a1218;
      border-color: #b0d0e0;
      box-shadow: 0 0 20px rgba(180, 220, 255, 0.3), inset 0 -4px 8px rgba(0,0,0,0.2);
      transform: scale(1.05);
      font-weight: bold;
    }

    .cell.connected {
      background: rgba(100, 200, 255, 0.25);
      border-color: #70c8ff;
      box-shadow: 0 0 16px rgba(100, 200, 255, 0.2);
    }

    .cell.ds9-glow {
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6) !important;
    }

    .cell.wave {
      animation: waveGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes waveGlow {
      0% { box-shadow: 0 0 4px rgba(160, 200, 240, 0.1); background: rgba(24, 32, 40, 0.2); }
      100% { box-shadow: 0 0 24px rgba(180, 220, 255, 0.25); background: rgba(60, 80, 100, 0.3); }
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      margin: 8px 0 6px;
      padding: 6px 4px;
      border-top: 1px solid rgba(100, 140, 170, 0.04);
    }

    .controls button {
      background: rgba(20, 28, 36, 0.5);
      border: 1px solid rgba(120, 160, 190, 0.08);
      color: #9ab0c0;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 1.2px;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .controls button:hover {
      background: rgba(40, 70, 90, 0.3);
      border-color: rgba(160, 200, 240, 0.2);
      color: #d0e8f8;
      transform: translateY(-1px);
    }
    .controls button.primary {
      border-color: rgba(180, 220, 255, 0.15);
      color: #c0dce8;
    }
    .controls button.primary:hover {
      background: rgba(60, 120, 160, 0.2);
      border-color: #80c0e0;
      box-shadow: 0 0 20px rgba(80, 180, 240, 0.05);
    }
    .controls button.ds9 {
      border-color: rgba(255, 215, 0, 0.1);
      color: #e8d080;
    }
    .controls button.ds9.active {
      background: rgba(255,215,0,0.08);
      border-color: #f0d080;
    }
    .controls button.danger {
      border-color: rgba(255, 80, 80, 0.08);
      color: #d06060;
    }
    .controls button.danger:hover {
      background: rgba(255, 80, 80, 0.04);
    }

    .info-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      font-size: 11px;
      color: #4a6a7a;
      padding: 4px 0;
      border-top: 1px solid rgba(100, 140, 170, 0.03);
      margin-top: 4px;
    }
    .info-row .val { color: #aac8d8; font-weight: 400; }
    .info-row .highlight { color: #e8d080; }

    .log {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      padding: 6px 14px;
      font-size: 10px;
      color: #4a6a7a;
      max-height: 60px;
      overflow-y: auto;
      border: 1px solid rgba(100, 140, 170, 0.02);
      margin-top: 8px;
      font-family: 'Consolas', monospace;
      line-height: 1.6;
    }
    .log .ok { color: #80d0b0; }
    .log .flow { color: #d0b080; }
    .log .whirl { color: #c080d0; }
    .log .ds9 { color: #e8d080; }
    .log .achse { color: #70c8ff; }
    .log .6d { color: #80d0b0; }
    .log .connect { color: #70c8ff; }
    .log .warn { color: #f0a070; }

    .footer {
      text-align: center;
      margin-top: 12px;
      color: #1a2a30;
      font-size: 9px;
      letter-spacing: 3px;
    }
    .footer .gold { color: #e8d080; }
    .footer .silver { color: #b0c8d8; }

    @media (max-width: 700px) {
      .container { padding: 12px; }
      .header h1 { font-size: 18px; letter-spacing: 3px; }
      .cell { font-size: 6px; }
      .controls button { font-size: 10px; padding: 4px 12px; }
      .status-badge { font-size: 9px; gap: 10px; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>⚙️ RESPO‑SCHALTUNG 2.0 <small>756 ACHSEN · ZAHNRAD‑METHODE</small></h1>
    <div class="status-badge">
      <span><span class="dot on" id="dotSchaltung"></span> SCHALTUNG</span>
      <span><span class="dot" id="dotVerbindung"></span> VERBINDUNG</span>
      <span><span class="dot pulse" id="dotAchse"></span> 756</span>
    </div>
  </div>

  <div class="grid-wrap">
    <div id="grid"></div>
  </div>

  <div class="controls">
    <button class="primary" id="btnVerbinden">🔗 VERBINDEN</button>
    <button class="primary" id="btnZurueck">↩️ ZURÜCK</button>
    <button class="ds9" id="btnDs9">★ DS9</button>
    <button id="btnReset">⟲ RESET</button>
  </div>

  <div class="info-row">
    <span>DATEIEN: <span class="val" id="fileCount">0</span></span>
    <span>AKTIV: <span class="val" id="activeCount">0</span></span>
    <span>VERBUNDEN: <span class="val" id="connectedCount">0</span></span>
    <span class="highlight">⚡ <span id="comboDisplay">ZAHNRAD</span></span>
  </div>

  <div class="log" id="log">
    [⚙️] RESPO‑SCHALTUNG 2.0 · Zahnrad‑Mechanik optimiert
  </div>

  <div class="footer">
    <span class="gold">★</span> PLATZHALTER IGNORIERT · DEAKTIVIEREN RÄUMT VERBINDUNGEN · <span class="silver">NC‑RAW 2.0</span>
  </div>
</div>

<script>
  // ==============================================================
  //  RESPO‑SCHALTUNG 2.0 – 756 ACHSEN – ZAHNRAD‑METHODE
  //  Fix: Platzhalter werden ignoriert, Deaktivieren löscht Verbindungen
  //  Auto‑Pulse überschreibt keine aktiven Zellen, DS9 addiert nur
  // ==============================================================

  // ─── DATEILISTE (bereinigt, doppelte Einträge entfernt) ──────
  const rawFileList = [
    "3.rom", "3hit90.js", "3×1.js", "3×3.js", "9×9.js",
    "CODEOWNERS.md", "CONTRIBUTING.md", "ID.json", "README.md",
    "anker.js", "api.js", "arbeit.js", "atom.raw.js", "build.js",
    "cache.js", "cache.raw.js", "call.js", "clock.js", "corridoor.js",
    "cpu.js", "cpu.raw.js", "echo.zahn.js", "energie.raw.js",
    "flanke.js", "geo.js", "gleichung.js", "gpu.js", "gpu.raw.js",
    "hall.rad.js", "mac.js", "mass.js", "pipe.js", "pipe.pipeline.js",
    "rad.js", "raid.pipeline.js", "ram.js", "ram.raw.js", "recall.js",
    "respo360.js", "respoDashboard.js", "rom.js", "rom.raw.js",
    "run.over", "schuss.js", "scsi.raid", "stage.js", "stage.pipeline.js",
    "status.json", "time.js", "use.js", "user.js", "verfahren.js",
    "work.js", "zahn.js", "ziel.js",
    "81", "6.raw", "64.raw", "64‑Matrix", "64‑Matrix.raw", "6d.raw",
    "6e.raw", "6s.raw", "81.raw", "81.rom", "A81‑Axis.js",
    "BEST‑KERN.html", "BEST‑STATIONEN.html", "ID.html", "M‑Axis.js",
    "README.md", "TMP‑Namen.raw", "T‑Axis.js", "UaW", "WaU.html",
    "a81.raw", "engine.js", "f.raw", "index.html", "m.raw", "m64.raw",
    "o.raw", "score.html", "stationen.html", "sys.raw", "t9.raw",
    "tem.raw", "tmp.raw", "u.raw",
    "9", "AURA", "use.user", "user.use", "MANA", "ZEN", "use",
    "243", "27.js", "3.js", "81.js", "81.room", "9.js", "9hoch9.json",
    "LICENSE-CLOSED.txt", "NC.math", "OUR.js", "PRE9×9.math",
    "ULTRA‑NC3×3.room", "ULTRA‑NC9×9.room", "X.room.CORE",
    "X.room.IN", "X.room.OUT", "axes.js", "cube9.js", "cxr.orbit.js",
    "fusion9.js", "ghost.html", "ghost.js", "lage.js",
    "navigator9.js", "pipeline12.master.js", "respo_bridge.js",
    "rith.engine.js", "schnitt.js", "sli.ready", "tmp.js",
    "ultra.kernel.js", "user", "3hoch3.js", "3hoch3.room", "3o3.js",
    "4u.html", "corridoor.transwarp.nc.js", "pos.js",
    "use,user", "HOLO.engine.js", "HOLO.room.js", "NC.room.js",
    "RAWATOR.geo.json", "RAWATOR.id.json", "RESPO.room.js",
    "SYS.js", "atom.js", "axiom.js", "beam.js", "beam.json",
    "core.js", "geo.md", "molecule.js", "M.room.js", "chess.role.js",
    "matrix.js", "VEC128", "VEC128.js", "VECTO8", "matrix81.js",
    "VECTOR", "vector.js", "12ALL.master.js", "BETA.js", "ECO.js",
    "GAMMA.js", "HTML.js", "INDEX.hyperraum.js", "INDEX.portal.js",
    "INDEX.respo.js", "INDEX.warb.js", "MEGA_INDEX.js",
    "MEGA_INDEX.zoom.js", "RUN360.js", "RUN8.js", "live.js",
    "AUTO.POS", "AUTO.run", "AUTO.sys", "SLAVE.sys",
    "VECTOR_MEASURE", "VECTOR_index", "VECTOR_index.list.index.allrespo",
    "VECTOR_list", "VECTOR_run", "auto.list", "master.sys", "vector.sys",
    "a.list"
  ];

  // Duplikate entfernen
  const fileList = [...new Set(rawFileList)];

  // ─── GRID ────────────────────────────────────────────────────
  const gridEl = document.getElementById('grid');
  const cells = [];
  const COLS = 27;
  const ROWS = 28;
  const TOTAL = COLS * ROWS;

  // State
  let activeIndex = -1;
  let connectedIndices = [];
  let ds9Mode = false;
  let comboCount = 0;

  // ─── PRÄFIX-LOGIK (ignoriert Platzhalter) ──────────────────
  function getPrefix(name) {
    if (name === '·' || name === '.') return null; // Platzhalter ignorieren
    const match = name.match(/^([0-9]+|[A-Za-z]+)/);
    return match ? match[1] : name.substring(0, 1);
  }

  // ─── ZELLEN AUFBAUEN ────────────────────────────────────────
  for (let i = 0; i < TOTAL; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const fileName = i < fileList.length ? fileList[i] : '·';
    cell.textContent = fileName;
    cell.dataset.index = i;
    cell.dataset.file = fileName;
    const prefix = getPrefix(fileName);
    cell.dataset.prefix = prefix || ''; // leer für Platzhalter

    cell.addEventListener('click', () => handleCellClick(i));

    gridEl.appendChild(cell);
    cells.push(cell);
  }

  // ─── KLICK-HANDLER ──────────────────────────────────────────
  function handleCellClick(index) {
    const cell = cells[index];
    const fileName = cell.dataset.file;
    const prefix = cell.dataset.prefix;

    // Platzhalter ignorieren (keine Verbindungen)
    if (!prefix || prefix === '') {
      log(`⛔ Platzhalter-Zelle ignoriert (keine Verbindung)`, 'warn');
      return;
    }

    // Toggle: wenn bereits aktiv, deaktivieren (inkl. Verbindungen löschen)
    if (activeIndex === index) {
      deactivateCell(index);
      clearConnections();
      activeIndex = -1;
      log(`⛔ ${fileName} deaktiviert · Verbindungen gelöscht`, 'flow');
      updateStats();
      return;
    }

    // Vorherige deaktivieren (Verbindungen bleiben bestehen, bis neue gesetzt werden)
    if (activeIndex >= 0) {
      deactivateCell(activeIndex);
    }

    // Neue aktivieren
    activateCell(index);
    activeIndex = index;
    log(`🔧 ${fileName} aktiviert (Präfix: ${prefix})`, 'connect');

    // Verbindung zu allen Zellen mit gleichem Präfix herstellen (außer Platzhalter)
    connectWithPrefix(prefix, index);
    updateStats();
  }

  function activateCell(index) {
    const cell = cells[index];
    cell.classList.add('active');
    cell.style.transform = 'scale(1.1)';
    playTone(600 + Math.random() * 200, 0.08);
  }

  function deactivateCell(index) {
    const cell = cells[index];
    cell.classList.remove('active');
    cell.style.transform = '';
  }

  function connectWithPrefix(prefix, excludeIndex) {
    // Bestehende Verbindungen löschen
    clearConnections();

    let count = 0;
    cells.forEach((cell, idx) => {
      if (idx === excludeIndex) return;
      const cellPrefix = cell.dataset.prefix;
      if (cellPrefix && cellPrefix === prefix) {
        cell.classList.add('connected');
        // DS9-Glow zusätzlich, wenn aktiv
        if (ds9Mode) cell.classList.add('ds9-glow');
        connectedIndices.push(idx);
        count++;
      }
    });

    if (count > 0) {
      log(`🔗 ${count} Verbindungen zu Präfix "${prefix}" hergestellt`, 'connect');
      document.getElementById('dotVerbindung').className = 'dot connected';
      comboCount++;
      if (comboCount >= 3) {
        log(`⚡ COMBO! ${comboCount} Verbindungen in Folge`, 'whirl');
        comboCount = 0;
      }
    } else {
      log(`⚠️ Keine weiteren Dateien mit Präfix "${prefix}"`, 'flow');
    }
    updateStats();
  }

  function clearConnections() {
    connectedIndices.forEach(idx => {
      const cell = cells[idx];
      cell.classList.remove('connected');
      cell.classList.remove('ds9-glow');
      cell.style.boxShadow = '';
    });
    connectedIndices = [];
    document.getElementById('dotVerbindung').className = 'dot';
  }

  // ─── DS9 ──────────────────────────────────────────────────────
  function toggleDs9() {
    ds9Mode = !ds9Mode;
    document.getElementById('btnDs9').classList.toggle('active', ds9Mode);
    log(ds9Mode ? '★ DS9 aktiv – goldener Zusatzglow' : '★ DS9 inaktiv', 'ds9');

    // Bestehenden Verbindungen DS9-Glow hinzufügen/entfernen (ohne connected zu überschreiben)
    connectedIndices.forEach(idx => {
      const cell = cells[idx];
      if (ds9Mode) {
        cell.classList.add('ds9-glow');
      } else {
        cell.classList.remove('ds9-glow');
        cell.style.boxShadow = ''; // connected-shadow bleibt durch Klasse
      }
    });
  }

  // ─── BUTTONS ──────────────────────────────────────────────────
  document.getElementById('btnVerbinden').addEventListener('click', () => {
    if (activeIndex < 0) {
      log('⚠️ Erst eine Zelle aktivieren (klicken)', 'flow');
      return;
    }
    const prefix = cells[activeIndex].dataset.prefix;
    if (!prefix) {
      log('⚠️ Platzhalter kann nicht verbinden', 'warn');
      return;
    }
    connectWithPrefix(prefix, activeIndex);
  });

  document.getElementById('btnZurueck').addEventListener('click', () => {
    if (activeIndex >= 0) {
      deactivateCell(activeIndex);
      activeIndex = -1;
    }
    clearConnections();
    comboCount = 0;
    log('↩️ Alle Verbindungen zurückgesetzt', 'flow');
    updateStats();
  });

  document.getElementById('btnDs9').addEventListener('click', toggleDs9);

  document.getElementById('btnReset').addEventListener('click', () => {
    if (activeIndex >= 0) deactivateCell(activeIndex);
    activeIndex = -1;
    clearConnections();
    comboCount = 0;
    cells.forEach(c => {
      c.style.transform = '';
      c.style.boxShadow = '';
      c.classList.remove('active', 'connected', 'wave', 'ds9-glow');
    });
    if (ds9Mode) {
      ds9Mode = false;
      document.getElementById('btnDs9').classList.remove('active');
    }
    log('⟲ RESET · Schaltung neu formatiert', 'flow');
    updateStats();
  });

  // ─── TASTATUR ──────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btnVerbinden').click(); }
    if (e.key === 'r' || e.key === 'R') document.getElementById('btnZurueck').click();
    if (e.key === 'd' || e.key === 'D') document.getElementById('btnDs9').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btnReset').click();
  });

  // ─── STATS ────────────────────────────────────────────────────
  function updateStats() {
    document.getElementById('fileCount').textContent = fileList.length;
    document.getElementById('activeCount').textContent = activeIndex >= 0 ? 1 : 0;
    document.getElementById('connectedCount').textContent = connectedIndices.length;
    const comboText = comboCount > 0 ? `ZAHNRAD ${comboCount}` : 'ZAHNRAD';
    document.getElementById('comboDisplay').textContent = comboText;
  }

  // ─── TON (simuliert) ──────────────────────────────────────────
  let audioCtx = null;
  function playTone(freq = 440, dur = 0.12) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq + (Math.random() * 30 - 15);
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (_) { /* still */ }
  }

  // ─── LOG ──────────────────────────────────────────────────────
  function log(msg, type = 'ok') {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    const cls = ['ok','flow','whirl','ds9','achse','6d','connect','warn'].includes(type) ? type : 'ok';
    el.innerHTML += `<div>[${time}] <span class="${cls}">${msg}</span></div>`;
    el.scrollTop = el.scrollHeight;
    // Begrenzung ohne Overflow
    while (el.children.length > 30) el.removeChild(el.firstChild);
  }

  // ─── AUTO‑PULSE (überschreibt keine aktiven Zellen) ──────────
  setInterval(() => {
    if (activeIndex < 0 && !ds9Mode) {
      const idx = Math.floor(Math.random() * TOTAL);
      const cell = cells[idx];
      // Nur wenn nicht aktiv oder verbunden
      if (!cell.classList.contains('active') && !cell.classList.contains('connected')) {
        cell.style.transform = 'scale(1.04)';
        cell.style.background = 'rgba(160,200,240,0.05)';
        setTimeout(() => {
          cell.style.transform = 'scale(1)';
          cell.style.background = '';
        }, 300);
      }
    }
  }, 800);

  // ─── INIT ─────────────────────────────────────────────────────
