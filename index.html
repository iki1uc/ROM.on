<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧿 ADMIN‑PULT · MAINBOARD · 756 ACHSEN</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: radial-gradient(ellipse at 20% 30%, #0a0e1a, #000000);
      min-height:100vh; display:flex; justify-content:center; align-items:center;
      font-family:'Segoe UI','Consolas',monospace; padding:12px; color:#c0d0d0;
    }
    .container {
      max-width:1400px; width:100%;
      background:rgba(6,8,16,0.6); backdrop-filter:blur(4px);
      border-radius:40px; padding:20px 24px 30px;
      border:1px solid rgba(160,200,240,0.05);
      box-shadow:0 20px 60px rgba(0,0,0,0.9), inset 0 0 80px rgba(100,180,255,0.02);
    }
    .header {
      display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap;
      border-bottom:1px solid rgba(160,200,240,0.06); padding-bottom:6px; margin-bottom:12px;
    }
    .header h1 {
      font-size:24px; font-weight:300; letter-spacing:4px;
      background:linear-gradient(135deg,#e0e8f0,#b0c8d8,#8098b0,#c0d8e8);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      display:flex; align-items:center; gap:8px;
    }
    .header h1 small { font-size:11px; letter-spacing:2px; -webkit-text-fill-color:#4a5a6a; color:#4a5a6a; }
    .status-bar {
      display:flex; gap:20px; font-size:11px; color:#5a7a8a;
    }
    .status-bar span { display:flex; align-items:center; gap:5px; }
    .led {
      display:inline-block; width:10px; height:10px; border-radius:50%;
      background:#2a4a5a; transition:0.3s;
    }
    .led.on { background:#8cf0d0; box-shadow:0 0 12px #8cf0d0; }
    .led.pulse { background:#f0d080; animation:pulse 1.2s infinite; }
    .led.warn { background:#ff6b6b; box-shadow:0 0 12px #ff6b6b; }
    @keyframes pulse { 0%,100%{opacity:0.4;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }

    /* MAINBOARD-LAYOUT */
    .mainboard {
      display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
      margin:14px 0 18px;
    }
    @media(max-width:900px){ .mainboard { grid-template-columns:1fr 1fr; } }
    @media(max-width:600px){ .mainboard { grid-template-columns:1fr; } }

    .slot {
      background:rgba(10,14,20,0.4); border:1px solid rgba(100,180,255,0.06);
      border-radius:16px; padding:12px; backdrop-filter:blur(2px);
      transition:all 0.2s; cursor:pointer;
      display:flex; flex-direction:column;
    }
    .slot:hover { border-color:rgba(160,200,240,0.15); transform:translateY(-2px); }
    .slot .chip {
      display:flex; justify-content:space-between; align-items:center;
      border-bottom:1px solid rgba(100,180,255,0.04); padding-bottom:6px; margin-bottom:6px;
    }
    .slot .chip .name {
      font-size:13px; font-weight:400; letter-spacing:1px;
      background:linear-gradient(135deg,#d0e0e8,#a0b8c8); -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .slot .chip .badge {
      font-size:8px; padding:2px 8px; border-radius:12px;
      border:1px solid rgba(255,215,0,0.15); color:#f0d080;
    }
    .slot .chip .badge.alpha { border-color:#ff6b6b; color:#ff6b6b; }
    .slot .chip .badge.beta { border-color:#f0d080; color:#f0d080; }
    .slot .chip .badge.stable { border-color:#8cf0d0; color:#8cf0d0; }

    .slot .repo-link {
      font-size:8px; color:#445555; margin:2px 0 4px;
      letter-spacing:0.5px;
    }
    .slot .repo-link span { color:#70c8ff; }

    .slot .controls {
      display:flex; gap:4px; flex-wrap:wrap; margin:4px 0;
    }
    .slot .controls button {
      background:rgba(20,28,36,0.3); border:1px solid rgba(100,200,255,0.04);
      color:#9ab0c0; padding:2px 10px; border-radius:14px; font-size:8px;
      font-family:inherit; cursor:pointer; transition:0.2s;
    }
    .slot .controls button:hover {
      background:rgba(40,80,100,0.2); color:#b8e2ff;
    }
    .slot .controls button.primary { border-color:rgba(255,215,0,0.1); color:#ffd700; }
    .slot .controls button.primary:hover { background:rgba(255,215,0,0.05); }

    .slot .status-indicator {
      display:flex; gap:6px; margin-top:4px; font-size:7px; color:#445555;
    }
    .slot .status-indicator .dot {
      width:6px; height:6px; border-radius:50%; display:inline-block;
    }
    .slot .status-indicator .dot.on { background:#8cf0d0; }
    .slot .status-indicator .dot.off { background:#2a4a5a; }

    /* ZAHNRAD-VERBINDUNGEN */
    .gear-view {
      background:rgba(10,14,20,0.3); border-radius:16px;
      border:1px solid rgba(100,180,255,0.03); padding:12px; margin:8px 0;
    }
    .gear-view h3 {
      color:#f0d080; font-size:10px; letter-spacing:2px;
      border-bottom:1px solid rgba(255,215,0,0.04); padding-bottom:4px; margin-bottom:6px;
    }
    .gear-cluster {
      display:flex; flex-wrap:wrap; gap:6px;
    }
    .gear-cluster .gear-item {
      background:rgba(0,0,0,0.2); border:1px solid rgba(255,215,0,0.04);
      border-radius:8px; padding:2px 10px; font-size:8px; color:#b0d0e0;
      cursor:pointer; transition:0.2s;
    }
    .gear-cluster .gear-item:hover {
      border-color:#f0d080; background:rgba(255,215,0,0.04);
    }
    .gear-cluster .gear-item .prefix { color:#f0d080; font-weight:bold; }

    .log {
      background:rgba(0,0,0,0.3); border-radius:14px; padding:6px 14px;
      font-size:9px; color:#3a5a6a; max-height:60px; overflow-y:auto;
      border:1px solid rgba(100,140,170,0.01); margin-top:8px; line-height:1.6;
      font-family:'Consolas',monospace;
    }
    .log .ok { color:#80d0b0; }
    .log .flow { color:#d0b080; }
    .log .ds9 { color:#e8d080; }
    .log .warn { color:#ff6b6b; }

    .footer {
      text-align:center; margin-top:12px; color:#1a2a30; font-size:8px; letter-spacing:3px;
    }
    .footer .gold { color:#e8d080; }
    .footer .silver { color:#b0c8d8; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🧿 ADMIN‑PULT <small>MAINBOARD · 756 ACHSEN</small></h1>
    <div class="status-bar">
      <span><span class="led on"></span> SYSTEM</span>
      <span><span class="led" id="ledGear"></span> ZAHNRAD</span>
      <span><span class="led" id="ledTest"></span> TEST</span>
    </div>
  </div>

  <!-- MAINBOARD mit Slots -->
  <div class="mainboard" id="mainboard"></div>

  <!-- ZAHNRAD-ANSICHT (Cluster) -->
  <div class="gear-view">
    <h3>⚙️ ZAHNRAD · PRÄFIX‑CLUSTER</h3>
    <div class="gear-cluster" id="gearCluster"></div>
  </div>

  <!-- LOG -->
  <div class="log" id="log">[🧿] Admin‑Pult initialisiert · Mainboard bereit</div>

  <div class="footer">
    <span class="gold">★</span> JEDER SLOT = EIN MODUL · <span class="silver">Zahnrad‑Methode aktiv</span>
  </div>
</div>

<script>
// ================================================================
// ADMIN‑PULT · MAINBOARD · 756 ACHSEN
// Module = Steckkarten, verknüpft mit Repos (aus Files.txt)
// Zahnrad‑Cluster gruppieren nach Präfix
// ================================================================

// ─── MODUL‑DEFINITIONEN ──────────────────────────────────────────
// Jedes Modul entspricht einem Subsystem aus den bereitgestellten HTMLs
const MODULES = [
  { id: 'quecksilber', label: 'QUECKSILBER', desc: '756 Achsen · 6D · Fluid',
    repo: 'iki1uc/QUECKSILBER', prefix: 'Q', status: 'stable',
    actions: ['6D STEP', 'DS9', 'FLUID', 'QUAKE'] },
  { id: 'metaball', label: 'METABALL', desc: 'Echte Fluid‑Physik · Tropfen',
    repo: 'iki1uc/METABALL', prefix: 'M', status: 'beta',
    actions: ['MAGNET', 'SPLIT', 'QUAKE', 'DS9'] },
  { id: 'rawator', label: 'RAWATOR · MAGNETO', desc: 'Cockpit · Krümmungsantrieb',
    repo: 'iki1uc/RAWATOR', prefix: 'R', status: 'stable',
    actions: ['VITAL', 'CO₂', 'H₂O', 'O₂'] },
  { id: 'comic81', label: '81×81 · COMIC', desc: 'DS9 · Suite · Continuum',
    repo: 'iki1uc/81x81-COMIC', prefix: 'C', status: 'alpha',
    actions: ['FORMEN', 'AXIOME', 'CONTINUUM'] },
  { id: 'respo-dash', label: 'REPO‑DASHBOARD', desc: 'GitHub‑Ampel · 799 Repos',
    repo: 'iki1uc/REPO-DASHBOARD', prefix: 'R', status: 'stable',
    actions: ['LADEN', 'FILTER'] },
  { id: 'planetarisch', label: 'PLANETARISCHER ORGANISMUS', desc: '3→9→27→81→243→729→3',
    repo: 'iki1uc/PLANET-ORGANISMUS', prefix: 'P', status: 'beta',
    actions: ['TEMPO', 'DS9', 'RESET'] },
  { id: 'respo-schaltung', label: 'RESPO‑SCHALTUNG', desc: 'Zahnrad‑Methode · 756 Achsen',
    repo: 'iki1uc/RESPO-SCHALTUNG', prefix: 'R', status: 'stable',
    actions: ['VERBINDEN', 'ZURÜCK', 'DS9'] },
  { id: 'boot-block', label: 'BOOT.BLOCK', desc: 'Master‑Boot · NC‑RAW',
    repo: 'iki1uc/BOOT-BLOCK', prefix: 'B', status: 'alpha',
    actions: ['SYNC', 'RESET'] },
  { id: 'admin-core', label: 'ADMIN‑CORE', desc: 'Zentrale Steuerung · Pult',
    repo: 'iki1uc/ADMIN-CORE', prefix: 'A', status: 'stable',
    actions: ['STATUS', 'LOGGING', 'RESET'] }
];

// ─── REPO‑LISTE (aus Files.txt extrahiert, repräsentativ) ──────
const REPOS = [
  'iki1uc/QUECKSILBER', 'iki1uc/METABALL', 'iki1uc/RAWATOR',
  'iki1uc/81x81-COMIC', 'iki1uc/REPO-DASHBOARD', 'iki1uc/PLANET-ORGANISMUS',
  'iki1uc/RESPO-SCHALTUNG', 'iki1uc/BOOT-BLOCK', 'iki1uc/ADMIN-CORE',
  'iki1uc/243', 'iki1uc/3hoch3', 'iki1uc/9hoch9',
  'iki1uc/ANIME', 'iki1uc/BOOT', 'iki1uc/CACHE',
  'iki1uc/CPU', 'iki1uc/GPU', 'iki1uc/RAM',
  'iki1uc/ROM', 'iki1uc/ROOT', 'iki1uc/RUN8',
  'iki1uc/SYS', 'iki1uc/use', 'iki1uc/user',
  'iki1uc/RAW', 'iki1uc/NC', 'iki1uc/RESPO',
  'iki1uc/OS', 'iki1uc/MAIN', 'iki1uc/CORE'
];

// ─── STATE ──────────────────────────────────────────────────────
let activeModule = null;
let gearMode = false;
const logEl = document.getElementById('log');

// ─── RENDER MAINBOARD ──────────────────────────────────────────
function renderMainboard() {
  const board = document.getElementById('mainboard');
  board.innerHTML = '';
  MODULES.forEach((mod, idx) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.id = mod.id;
    const statusClass = mod.status === 'alpha' ? 'alpha' : mod.status === 'beta' ? 'beta' : 'stable';
    slot.innerHTML = `
      <div class="chip">
        <span class="name">${mod.label}</span>
        <span class="badge ${statusClass}">${mod.status.toUpperCase()}</span>
      </div>
      <div class="repo-link">📁 <span>${mod.repo}</span></div>
      <div style="font-size:7px;color:#445555;margin:2px 0;">${mod.desc}</div>
      <div class="controls">
        ${mod.actions.map(a => `<button class="primary" data-action="${a}">${a}</button>`).join('')}
        <button data-action="test">🧪 TEST</button>
      </div>
      <div class="status-indicator">
        <span><span class="dot on"></span> aktiv</span>
        <span><span class="dot off"></span> standby</span>
      </div>
    `;
    // Klick auf Slot = aktivieren
    slot.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      activateModule(mod.id);
    });
    // Buttons
    slot.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = btn.dataset.action;
        if (action === 'test') {
          log(`🧪 Test von ${mod.label} gestartet`, 'flow');
          document.getElementById('ledTest').className = 'led pulse';
          setTimeout(() => document.getElementById('ledTest').className = 'led', 1500);
        } else {
          log(`▶ ${mod.label} · Aktion: ${action}`, 'ok');
          // Simuliere modulspezifische Reaktion
          if (mod.id === 'quecksilber' && action === '6D STEP') {
            log('🌀 6D‑Welle über alle Achsen', 'ds9');
          } else if (mod.id === 'metaball' && action === 'MAGNET') {
            log('🧲 Magnetfeld aktiviert', 'flow');
          } else if (mod.id === 'rawator' && action === 'VITAL') {
            log('🧬 Vitalwert steigt', 'ok');
          } else if (mod.id === 'comic81' && action === 'FORMEN') {
            log('🌀 Neue Figur geformt', 'ds9');
          } else if (mod.id === 'respo-dash' && action === 'LADEN') {
            log('📊 Repos geladen (799)', 'ok');
          } else if (mod.id === 'planetarisch' && action === 'TEMPO') {
            log('⏩ Tempo auf 2.5x', 'flow');
          } else if (mod.id === 'respo-schaltung' && action === 'VERBINDEN') {
            log('🔗 Zahnrad‑Verbindung hergestellt', 'ds9');
          } else if (mod.id === 'boot-block' && action === 'SYNC') {
            log('🔗 BOOT.BLOCK synchronisiert', 'ok');
          } else if (mod.id === 'admin-core' && action === 'STATUS') {
            log('📊 Systemstatus: alle Module stabil', 'ok');
          }
        }
      });
    });
    board.appendChild(slot);
  });
}

// ─── MODUL AKTIVIEREN ──────────────────────────────────────────
function activateModule(id) {
  const mod = MODULES.find(m => m.id === id);
  if (!mod) return;
  activeModule = id;
  log(`🔧 Modul "${mod.label}" aktiviert`, 'flow');
  // Alle Slots hervorheben
  document.querySelectorAll('.slot').forEach(el => {
    el.style.borderColor = el.dataset.id === id ? 'rgba(255,215,0,0.3)' : 'rgba(100,180,255,0.06)';
  });
  // Zahnrad‑Cluster aktualisieren (basierend auf Präfix)
  renderGearCluster(mod.prefix);
}

// ─── ZAHNRAD‑CLUSTER ────────────────────────────────────────────
function renderGearCluster(activePrefix = null) {
  const container = document.getElementById('gearCluster');
  // Alle Präfixe aus Modulen sammeln
  const prefixMap = {};
  MODULES.forEach(mod => {
    if (!prefixMap[mod.prefix]) prefixMap[mod.prefix] = [];
    prefixMap[mod.prefix].push(mod.label);
  });
  container.innerHTML = '';
  // Sortierte Liste der Präfixe
  const sorted = Object.keys(prefixMap).sort();
  sorted.forEach(pref => {
    const item = document.createElement('span');
    item.className = 'gear-item';
    if (pref === activePrefix) item.style.borderColor = '#f0d080';
    const mods = prefixMap[pref];
    item.innerHTML = `<span class="prefix">${pref}</span> (${mods.length}) · ${mods.join(', ')}`;
    item.addEventListener('click', () => {
      // Filtere Module mit diesem Präfix
      const filtered = MODULES.filter(m => m.prefix === pref);
      log(`⚙️ Zahnrad‑Cluster ${pref}: ${filtered.map(m=>m.label).join(', ')}`, 'ds9');
      document.getElementById('ledGear').className = 'led pulse';
      setTimeout(() => document.getElementById('ledGear').className = 'led', 1000);
    });
    container.appendChild(item);
  });
}

// ─── LOG ──────────────────────────────────────────────────────
function log(msg, type = 'ok') {
  const time = new Date().toLocaleTimeString();
  const cls = ['ok','flow','ds9','warn'].includes(type) ? type : 'ok';
  logEl.innerHTML += `<div>[${time}] <span class="${cls}">${msg}</span></div>`;
  logEl.scrollTop = logEl.scrollHeight;
  if (logEl.children.length > 30) logEl.removeChild(logEl.firstChild);
}

// ─── INIT ──────────────────────────────────────────────────────
renderMainboard();
renderGearCluster();
log('🧿 Admin‑Pult geladen · ' + MODULES.length + ' Module', 'ds9');
log('⌨️  Klick auf Slot = Modul aktivieren · Aktionen testen', 'flow');
</script>
</body>
</html>
