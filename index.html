<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧿 RESPO‑SCHALTUNG · 9‑STUFIG · 3 PARAMETER</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at 20% 30%, #0a0e1a, #000000);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Consolas', monospace;
      padding: 16px;
      color: #c0d0d0;
    }

    .container {
      max-width: 1300px;
      width: 100%;
      background: rgba(6, 8, 16, 0.6);
      backdrop-filter: blur(4px);
      border-radius: 40px;
      padding: 24px 30px 30px;
      border: 1px solid rgba(160, 200, 240, 0.05);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 80px rgba(100, 180, 255, 0.02);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(160, 200, 240, 0.06);
      padding-bottom: 10px;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #e0e8f0, #b0c8d8, #8098b0, #c0d8e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 small {
      font-size: 13px;
      letter-spacing: 2px;
      -webkit-text-fill-color: #4a5a6a;
      color: #4a5a6a;
    }

    .status-leds {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: #5a7a8a;
    }
    .status-leds span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .led {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2a4a5a;
      transition: 0.3s;
    }
    .led.on { background: #8cf0d0; box-shadow: 0 0 12px #8cf0d0; }
    .led.pulse { background: #f0d080; animation: pulse 1.2s infinite; }
    .led.off { background: #2a4a5a; }
    @keyframes pulse { 0%,100%{opacity:0.4;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }

    /* 3×3 Raster */
    .grid-3x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 16px 0 20px;
    }
    @media (max-width: 700px) {
      .grid-3x3 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .grid-3x3 { grid-template-columns: 1fr; }
    }

    .modul {
      background: rgba(10, 14, 20, 0.5);
      border: 1px solid rgba(100, 180, 255, 0.06);
      border-radius: 20px;
      padding: 16px 14px;
      backdrop-filter: blur(2px);
      transition: all 0.25s;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .modul:hover {
      border-color: rgba(160, 200, 240, 0.15);
      transform: translateY(-2px);
    }
    .modul .icon {
      font-size: 32px;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .modul .name {
      font-size: 14px;
      font-weight: 500;
      color: #d0e0e8;
      letter-spacing: 0.5px;
    }
    .modul .status-tag {
      font-size: 9px;
      padding: 2px 12px;
      border-radius: 20px;
      margin: 4px 0 6px;
      background: rgba(0,0,0,0.2);
      border: 1px solid transparent;
    }
    .modul .status-tag.stabil { border-color: #8cf0d0; color: #8cf0d0; }
    .modul .status-tag.beta { border-color: #f0d080; color: #f0d080; }
    .modul .status-tag.alpha { border-color: #ff6b6b; color: #ff6b6b; }

    .modul .toggle {
      margin-top: 4px;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 10px;
      color: #5a7a8a;
    }
    .modul .toggle .switch {
      width: 36px;
      height: 18px;
      background: #1a2a3a;
      border-radius: 30px;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid rgba(100,180,255,0.05);
    }
    .modul .toggle .switch .knob {
      width: 14px;
      height: 14px;
      background: #4a6a7a;
      border-radius: 50%;
      position: absolute;
      top: 1px;
      left: 2px;
      transition: 0.25s;
    }
    .modul .toggle .switch.on {
      background: #1a4a3a;
      border-color: #8cf0d0;
    }
    .modul .toggle .switch.on .knob {
      left: 18px;
      background: #8cf0d0;
      box-shadow: 0 0 12px #8cf0d0;
    }

    .modul .verbindungen {
      font-size: 8px;
      color: #445555;
      margin-top: 3px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modul .verbindungen .conn { color: #70c8ff; }

    .modul.ausgewaehlt {
      border-color: #f0d080;
      box-shadow: 0 0 20px rgba(255,215,0,0.1);
    }

    /* Parameter */
    .param-section {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin: 12px 0 18px;
      background: rgba(0,0,0,0.2);
      border-radius: 20px;
      padding: 16px 20px;
      border: 1px solid rgba(100,180,255,0.02);
    }
    @media (max-width: 700px) {
      .param-section { grid-template-columns: 1fr; }
    }
    .param {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .param .label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #5a7a8a;
      letter-spacing: 0.5px;
    }
    .param .label .wert { color: #c0d8e8; font-weight: bold; }
    .param input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #1a2a3a;
      border-radius: 4px;
      outline: none;
    }
    .param input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #70c8ff;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(100,200,255,0.2);
    }

    /* Verbindungsmatrix + Log */
    .bottom-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 12px;
    }
    @media (max-width: 700px) {
      .bottom-panel { grid-template-columns: 1fr; }
    }

    .connections {
      background: rgba(0,0,0,0.2);
      border-radius: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(100,180,255,0.02);
    }
    .connections h3 {
      font-size: 11px;
      letter-spacing: 2px;
      color: #f0d080;
      border-bottom: 1px solid rgba(255,215,0,0.04);
      padding-bottom: 4px;
      margin-bottom: 8px;
    }
    .conn-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 10px;
      color: #5a7a8a;
    }
    .conn-list .pair {
      background: rgba(0,0,0,0.2);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid rgba(100,200,255,0.04);
    }
    .conn-list .pair .mod { color: #b0d0e0; }

    .log-box {
      background: rgba(0,0,0,0.2);
      border-radius: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(100,180,255,0.02);
      max-height: 150px;
      overflow-y: auto;
    }
    .log-box h3 {
      font-size: 11px;
      letter-spacing: 2px;
      color: #70c8ff;
      border-bottom: 1px solid rgba(0,204,255,0.04);
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .log-box .entry {
      font-size: 9px;
      color: #3a5a6a;
      line-height: 1.5;
      border-bottom: 1px solid rgba(100,180,255,0.01);
      padding: 2px 0;
    }
    .log-box .entry .time { color: #445555; }
    .log-box .entry .msg { color: #80d0b0; }
    .log-box .entry .msg.conn { color: #70c8ff; }
    .log-box .entry .msg.warn { color: #f0d080; }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .controls button {
      background: rgba(20, 28, 36, 0.5);
      border: 1px solid rgba(120, 160, 190, 0.08);
      color: #9ab0c0;
      padding: 6px 20px;
      border-radius: 30px;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }
    .controls button:hover {
      background: rgba(40, 70, 90, 0.25);
      border-color: rgba(160, 200, 240, 0.15);
      color: #d0e8f8;
    }
    .controls button.primary {
      border-color: rgba(255,215,0,0.1);
      color: #f0d080;
    }
    .controls button.primary:hover {
      background: rgba(255,215,0,0.05);
      border-color: #f0d080;
    }
    .controls button.danger {
      border-color: rgba(255,80,80,0.08);
      color: #d06060;
    }
    .controls button.danger:hover {
      background: rgba(255,80,80,0.04);
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #1a2a30;
      font-size: 9px;
      letter-spacing: 3px;
    }
    .footer .gold { color: #e8d080; }
    .footer .silver { color: #b0c8d8; }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🧿 RESPO‑SCHALTUNG <small>9‑STUFIG · 3 PARAMETER</small></h1>
    <div class="status-leds">
      <span><span class="led on" id="ledSystem"></span> SYSTEM</span>
      <span><span class="led pulse" id="ledIntelligenz"></span> INTELLIGENZ</span>
      <span><span class="led" id="ledVerb"></span> VERBINDUNG</span>
    </div>
  </div>

  <!-- 3×3 Module -->
  <div class="grid-3x3" id="modulGrid"></div>

  <!-- 3 Parameter -->
  <div class="param-section">
    <div class="param">
      <div class="label"><span>⚙️ ACHSE</span><span class="wert" id="wertAchse">50</span></div>
      <input type="range" id="sliderAchse" min="0" max="100" value="50">
    </div>
    <div class="param">
      <div class="label"><span>💧 FLUID</span><span class="wert" id="wertFluid">50</span></div>
      <input type="range" id="sliderFluid" min="0" max="100" value="50">
    </div>
    <div class="param">
      <div class="label"><span>★ DS9</span><span class="wert" id="wertDs9">50</span></div>
      <input type="range" id="sliderDs9" min="0" max="100" value="50">
    </div>
  </div>

  <!-- Bottom Panel -->
  <div class="bottom-panel">
    <div class="connections">
      <h3>🔗 VERBINDUNGEN</h3>
      <div class="conn-list" id="connList">Keine Verbindungen</div>
    </div>
    <div class="log-box" id="logBox">
      <h3>📋 PROTOKOLL</h3>
      <div id="logEntries"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="primary" id="btnAuto">🧠 INTELLIGENZ</button>
    <button id="btnResetVerbindungen">⟲ VERBINDUNGEN ZURÜCK</button>
    <button class="danger" id="btnResetAll">⟲ ALLES RESET</button>
  </div>

  <div class="footer">
    <span class="gold">★</span> JEDER SCHALTER IST EIN REPO · <span class="silver">9‑STUFIGE LOGIK · 3 PARAMETER</span>
  </div>
</div>

<script>
// ================================================================
//  RESPO‑SCHALTUNG · 9‑STUFIG · 3 PARAMETER
//  Module = Haupt‑Repos aus deiner Sammlung
//  Verbindungen = logische Paare (bidirektional)
//  Intelligenz = automatische Konfiguration basierend auf Parametern
// ================================================================

// ─── MODUL‑DEFINITIONEN ──────────────────────────────────────────
const MODULE_DATA = [
  { id: 'quecksilber', icon: '🧿', name: 'QUECKSILBER', status: 'stabil', prefix: 'Q' },
  { id: 'metaball', icon: '🔮', name: 'METABALL', status: 'beta', prefix: 'M' },
  { id: 'rawator', icon: '🧬', name: 'RAWATOR', status: 'stabil', prefix: 'R' },
  { id: 'comic81', icon: '🎨', name: '81×81·COMIC', status: 'alpha', prefix: 'C' },
  { id: 'repo-dash', icon: '📊', name: 'REPO‑DASHBOARD', status: 'stabil', prefix: 'R' },
  { id: 'planet', icon: '🌌', name: 'PLANET‑ORGANISMUS', status: 'beta', prefix: 'P' },
  { id: 'respo-schalt', icon: '⚙️', name: 'RESPO‑SCHALTUNG', status: 'stabil', prefix: 'R' },
  { id: 'boot-block', icon: '🔗', name: 'BOOT‑BLOCK', status: 'alpha', prefix: 'B' },
  { id: 'admin-core', icon: '🖥️', name: 'ADMIN‑CORE', status: 'stabil', prefix: 'A' }
];

// ─── STATE ──────────────────────────────────────────────────────
const state = {
  moduleStatus: {}, // id -> true/false (an/aus)
  connections: [],  // [{a: id, b: id}]
  selected: null,   // id für Verbindungsaufbau
  params: { achse: 50, fluid: 50, ds9: 50 },
  log: []
};

// ─── INIT ──────────────────────────────────────────────────────
function initState() {
  MODULE_DATA.forEach(m => state.moduleStatus[m.id] = true);
  state.connections = [];
  state.selected = null;
  // Leere Log
  state.log = [];
  document.getElementById('logEntries').innerHTML = '';
  logMessage('🔌 System initialisiert · 9 Module geladen', 'ok');
}

// ─── RENDER GRID ──────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('modulGrid');
  grid.innerHTML = '';
  MODULE_DATA.forEach(mod => {
    const isOn = state.moduleStatus[mod.id];
    const div = document.createElement('div');
    div.className = 'modul' + (state.selected === mod.id ? ' ausgewaehlt' : '');
    div.dataset.id = mod.id;

    // Icon, Name, Status
    div.innerHTML = `
      <div class="icon">${mod.icon}</div>
      <div class="name">${mod.name}</div>
      <div class="status-tag ${mod.status}">${mod.status.toUpperCase()}</div>
      <div class="toggle">
        <span>${isOn ? 'AN' : 'AUS'}</span>
        <div class="switch ${isOn ? 'on' : ''}" data-id="${mod.id}">
          <div class="knob"></div>
        </div>
      </div>
      <div class="verbindungen" id="verb-${mod.id}"></div>
    `;

    // Switch Klick
    const sw = div.querySelector('.switch');
    sw.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleModule(mod.id);
    });

    // Modul Klick für Verbindungsauswahl
    div.addEventListener('click', (e) => {
      // Wenn auf Switch geklickt, schon behandelt
      if (e.target.closest('.switch')) return;
      handleModulClick(mod.id);
    });

    grid.appendChild(div);
  });
  updateVerbindungsAnzeige();
}

// ─── MODUL TOGGLE ──────────────────────────────────────────────
function toggleModule(id) {
  state.moduleStatus[id] = !state.moduleStatus[id];
  const isOn = state.moduleStatus[id];
  // Verbindungen mit diesem Modul entfernen, wenn aus
  if (!isOn) {
    state.connections = state.connections.filter(c => c.a !== id && c.b !== id);
    if (state.selected === id) state.selected = null;
    logMessage(`⛔ ${getModulName(id)} ausgeschaltet · Verbindungen gelöscht`, 'warn');
  } else {
    logMessage(`✅ ${getModulName(id)} eingeschaltet`, 'ok');
  }
  renderGrid();
  updateVerbindungsAnzeige();
  updateLEDs();
}

// ─── MODUL KLICK (Verbindung) ─────────────────────────────────
function handleModulClick(id) {
  if (!state.moduleStatus[id]) {
    logMessage(`⚠️ ${getModulName(id)} ist aus – zum Verbinden einschalten`, 'warn');
    return;
  }
  if (state.selected === null) {
    state.selected = id;
    logMessage(`🔗 ${getModulName(id)} ausgewählt – klicke Zielmodul`, 'conn');
    renderGrid();
    return;
  }
  if (state.selected === id) {
    state.selected = null;
    logMessage(`↩️ Auswahl aufgehoben`, 'ok');
    renderGrid();
    return;
  }
  // Verbindung herstellen oder löschen
  const a = state.selected;
  const b = id;
  const exists = state.connections.some(c => (c.a === a && c.b === b) || (c.a === b && c.b === a));
  if (exists) {
    state.connections = state.connections.filter(c => !((c.a === a && c.b === b) || (c.a === b && c.b === a)));
    logMessage(`🔗 Verbindung ${getModulName(a)} ↔ ${getModulName(b)} getrennt`, 'conn');
  } else {
    state.connections.push({ a, b });
    logMessage(`🔗 Verbindung ${getModulName(a)} ↔ ${getModulName(b)} hergestellt`, 'conn');
  }
  state.selected = null;
  renderGrid();
  updateVerbindungsAnzeige();
  updateLEDs();
}

// ─── VERBINDUNGSANZEIGE ──────────────────────────────────────
function updateVerbindungsAnzeige() {
  // Anzeige in den Modulen
  MODULE_DATA.forEach(mod => {
    const el = document.getElementById(`verb-${mod.id}`);
    if (el) {
      const conns = state.connections
        .filter(c => c.a === mod.id || c.b === mod.id)
        .map(c => c.a === mod.id ? getModulName(c.b) : getModulName(c.a));
      el.textContent = conns.length ? '🔗 ' + conns.join(' · ') : '';
    }
  });

  // Verbindungsliste
  const list = document.getElementById('connList');
  if (state.connections.length === 0) {
    list.innerHTML = 'Keine Verbindungen';
  } else {
    list.innerHTML = state.connections.map(c =>
      `<span class="pair"><span class="mod">${getModulName(c.a)}</span> ↔ <span class="mod">${getModulName(c.b)}</span></span>`
    ).join('');
  }
}

// ─── HILFSFUNKTIONEN ──────────────────────────────────────────
function getModulName(id) {
  const m = MODULE_DATA.find(x => x.id === id);
  return m ? m.name : id;
}

function updateLEDs() {
  const anyConn = state.connections.length > 0;
  document.getElementById('ledVerb').className = 'led ' + (anyConn ? 'on' : '');
  const anyOn = Object.values(state.moduleStatus).some(v => v === true);
  document.getElementById('ledSystem').className = 'led ' + (anyOn ? 'on' : 'off');
}

// ─── LOG ──────────────────────────────────────────────────────
function logMessage(msg, type = 'ok') {
  const container = document.getElementById('logEntries');
  const entry = document.createElement('div');
  entry.className = 'entry';
  const time = new Date().toLocaleTimeString();
  const cls = type === 'conn' ? 'conn' : type === 'warn' ? 'warn' : 'msg';
  entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${cls}">${msg}</span>`;
  container.appendChild(entry);
  container.scrollTop = container.scrollHeight;
  // Begrenzen
  while (container.children.length > 40) container.removeChild(container.firstChild);
}

// ─── PARAMETER ──────────────────────────────────────────────────
function setupSliders() {
  const sliders = [
    { id: 'sliderAchse', key: 'achse', display: 'wertAchse' },
    { id: 'sliderFluid', key: 'fluid', display: 'wertFluid' },
    { id: 'sliderDs9', key: 'ds9', display: 'wertDs9' }
  ];
  sliders.forEach(s => {
    const el = document.getElementById(s.id);
    const display = document.getElementById(s.display);
    el.addEventListener('input', () => {
      const val = parseInt(el.value);
      state.params[s.key] = val;
      display.textContent = val;
      // Parameter beeinflussen automatisch Module (Intelligenz)
      autoSchaltung();
    });
  });
}

// ─── INTELLIGENZ (AUTO-SCHALTUNG) ──────────────────────────────
function autoSchaltung() {
  const p = state.params;
  // Modul-Bedingungen basierend auf Parametern
  // Achse > 50 → QUECKSILBER, RESPO-SCHALTUNG, ADMIN-CORE
  // Fluid > 50 → METABALL, RAWATOR, PLANET
  // DS9 > 50 → COMIC81, BOOT-BLOCK, REPO-DASH
  const regeln = [
    { id: 'quecksilber', bedingung: p.achse > 50 },
    { id: 'metaball', bedingung: p.fluid > 50 },
    { id: 'rawator', bedingung: p.fluid > 40 },
    { id: 'comic81', bedingung: p.ds9 > 50 },
    { id: 'repo-dash', bedingung: p.ds9 > 30 },
    { id: 'planet', bedingung: p.fluid > 30 },
    { id: 'respo-schalt', bedingung: p.achse > 40 },
    { id: 'boot-block', bedingung: p.ds9 > 40 },
    { id: 'admin-core', bedingung: p.achse > 30 }
  ];

  let changes = 0;
  regeln.forEach(r => {
    const soll = r.bedingung;
    const ist = state.moduleStatus[r.id];
    if (soll !== ist) {
      state.moduleStatus[r.id] = soll;
      changes++;
    }
  });

  if (changes > 0) {
    logMessage(`🧠 Intelligenz aktiv · ${changes} Module neu konfiguriert`, 'conn');
    // Verbindungen automatisch anpassen (paarweise)
    const aktive = MODULE_DATA.filter(m => state.moduleStatus[m.id]).map(m => m.id);
    // Verbinde alle aktiven mit ähnlichem Präfix (R->R, etc.)
    const neueConn = [];
    for (let i = 0; i < aktive.length; i++) {
      for (let j = i+1; j < aktive.length; j++) {
        const a = MODULE_DATA.find(m => m.id === aktive[i]);
        const b = MODULE_DATA.find(m => m.id === aktive[j]);
        if (a && b && a.prefix === b.prefix) {
          neueConn.push({ a: a.id, b: b.id });
        }
      }
    }
    state.connections = neueConn;
    renderGrid();
    updateVerbindungsAnzeige();
    updateLEDs();
  }
}

// ─── RESETS ─────────────────────────────────────────────────────
function resetVerbindungen() {
  state.connections = [];
  state.selected = null;
  renderGrid();
  updateVerbindungsAnzeige();
  updateLEDs();
  logMessage('⟲ Alle Verbindungen zurückgesetzt', 'ok');
}

function resetAll() {
  MODULE_DATA.forEach(m => state.moduleStatus[m.id] = true);
  state.connections = [];
  state.selected = null;
  state.params = { achse: 50, fluid: 50, ds9: 50 };
  document.getElementById('sliderAchse').value = 50;
  document.getElementById('sliderFluid').value = 50;
  document.getElementById('sliderDs9').value = 50;
  document.getElementById('wertAchse').textContent = '50';
  document.getElementById('wertFluid').textContent = '50';
  document.getElementById('wertDs9').textContent = '50';
  document.getElementById('logEntries').innerHTML = '';
  logMessage('⟲ ALLES RESET · System neu gestartet', 'ok');
  renderGrid();
  updateVerbindungsAnzeige();
  updateLEDs();
}

// ─── BUTTONS ────────────────────────────────────────────────────
document.getElementById('btnAuto').addEventListener('click', () => {
  // Setze Parameter auf zufällige Werte und führe Auto aus
  const zufall = () => Math.floor(Math.random() * 100);
  ['achse', 'fluid', 'ds9'].forEach(key => {
    const val = zufall();
    state.params[key] = val;
    const slider = document.getElementById(key === 'achse' ? 'sliderAchse' : key === 'fluid' ? 'sliderFluid' : 'sliderDs9');
    slider.value = val;
    const display = document.getElementById(key === 'achse' ? 'wertAchse' : key === 'fluid' ? 'wertFluid' : 'wertDs9');
    display.textContent = val;
  });
  autoSchaltung();
  logMessage('🧠 INTELLIGENZ manuell ausgelöst · Parameter zufällig', 'conn');
});

document.getElementById('btnResetVerbindungen').addEventListener('click', resetVerbindungen);
document.getElementById('btnResetAll').addEventListener('click', resetAll);

// ─── TASTATUR ──────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'i' || e.key === 'I') document.getElementById('btnAuto').click();
  if (e.key === 'r' || e.key === 'R') document.getElementById('btnResetVerbindungen').click();
  if (e.key === 'x' || e.key === 'X') document.getElementById('btnResetAll').click();
});

// ─── INIT ──────────────────────────────────────────────────────
initState();
renderGrid();
setupSliders();
updateLEDs();
logMessage('⌨️  i=Intelligenz  r=Reset Verbindungen  x=Alles Reset', 'ok');
</script>

</body>
</html>
